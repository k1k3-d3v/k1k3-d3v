<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Project Odin architecture</title>
  <desc id="desc">Animated architecture diagram connecting Odin to automation, local AI and cloud services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="408" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <g fill="none" stroke="#58a6ff" stroke-width="2">
    <path id="toAutomation" d="M500 108 C500 150 170 132 170 194"/>
    <path id="toAi" d="M500 108 L500 194"/>
    <path id="toCloud" d="M500 108 C500 150 830 132 830 194"/>
  </g>

  <g fill="#58a6ff" filter="url(#glow)">
    <circle r="5"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#toAutomation"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.4s" begin=".5s" repeatCount="indefinite"><mpath href="#toAi"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#toCloud"/></animateMotion></circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <rect x="380" y="34" width="240" height="74" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;.45;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="408" cy="58" r="6" fill="#3fb950" filter="url(#glow)">
        <animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="500" y="68" fill="#f0f6fc" font-size="27" font-weight="800" text-anchor="middle">ODIN</text>
      <text x="500" y="91" fill="#8b949e" font-size="12" text-anchor="middle">HOMELAB CONTROL PLANE</text>
    </g>

    <g transform="translate(40 194)">
      <rect width="260" height="174" rx="14" fill="#0d1117" stroke="#30363d"/>
      <rect width="260" height="5" rx="2" fill="#a371f7"/>
      <text x="24" y="40" fill="#f0f6fc" font-size="18" font-weight="700">AUTOMATION</text>
      <text x="24" y="72" fill="#8b949e" font-size="14">Home Assistant</text>
      <text x="24" y="98" fill="#8b949e" font-size="14">Zigbee / MQTT</text>
      <text x="24" y="124" fill="#8b949e" font-size="14">ESPHome</text>
      <text x="24" y="150" fill="#8b949e" font-size="14">Frigate</text>
    </g>

    <g transform="translate(370 194)">
      <rect width="260" height="174" rx="14" fill="#0d1117" stroke="#30363d"/>
      <rect width="260" height="5" rx="2" fill="#39d0d8"/>
      <text x="24" y="40" fill="#f0f6fc" font-size="18" font-weight="700">LOCAL AI</text>
      <text x="24" y="72" fill="#8b949e" font-size="14">Ollama</text>
      <text x="24" y="98" fill="#8b949e" font-size="14">Open WebUI</text>
      <text x="24" y="124" fill="#8b949e" font-size="14">Local LLMs</text>
      <text x="24" y="150" fill="#8b949e" font-size="14">ROCm</text>
    </g>

    <g transform="translate(700 194)">
      <rect width="260" height="174" rx="14" fill="#0d1117" stroke="#30363d"/>
      <rect width="260" height="5" rx="2" fill="#58a6ff"/>
      <text x="24" y="40" fill="#f0f6fc" font-size="18" font-weight="700">SELF-HOSTED CLOUD</text>
      <text x="24" y="72" fill="#8b949e" font-size="14">Nextcloud</text>
      <text x="24" y="98" fill="#8b949e" font-size="14">Immich</text>
      <text x="24" y="124" fill="#8b949e" font-size="14">Mealie</text>
      <text x="24" y="150" fill="#8b949e" font-size="14">Caddy</text>
    </g>

    <text x="500" y="393" fill="#484f58" font-size="11" text-anchor="middle">PACKETS IN MOTION // ALL SYSTEMS NOMINAL</text>
  </g>
</svg>
